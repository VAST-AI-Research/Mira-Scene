name: mira-segmentation
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1
  - pip
  - setuptools<81
  - pip:
      - "fastapi>=0.115"
      - "uvicorn[standard]>=0.32"
      - "python-multipart>=0.0.12"
      - "pillow>=10"
      - "numpy>=1.26"
      - "openai>=1.55"
      - "pyyaml>=6"
      - "pytest>=8"
      - einops
      - pycocotools
      - scipy
      - psutil
      - "opencv-python==4.9.0.80"
      - "matplotlib==3.8.4"
      - "iopath==0.1.10"
