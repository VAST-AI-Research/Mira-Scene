name: ccm_voxel_scale
tag: pretrain_l1_cosine
exp_root_dir: "outputs"
seed: 42

# ---------------------------------------------------------------------------
# Dataset anchors
# ---------------------------------------------------------------------------
anchors:
  ObjaverseParam10k: &ObjaverseParam10k
    summary_json: "/path/to/objaverse_10k_outpaint/align_summary_10k_with_mesh_tf.json"
    valid_scenes_dir: "/path/to/objaverse_10k_outpaint/valid_scenes"
    height: 518
    width: 518
    voxel_res: 64
    use_bbox_layout: true
    skip_exists_check: false
    canonicalize_azimuth: true

  ObjaverseParam65k: &ObjaverseParam65k
    summary_json: "/path/to/objaverse_65k_outpaint_blank/align_summary_65k_with_mesh_tf.json"
    valid_scenes_dir: "/path/to/objaverse_65k_outpaint_blank/valid_scenes"
    height: 518
    width: 518
    voxel_res: 64
    use_bbox_layout: true
    skip_exists_check: true
    canonicalize_azimuth: true

  ObjaverseParam65kOrbit: &ObjaverseParam65kOrbit
    summary_json: "/path/to/objaverse_65k_renderOrbit_outpaint_blank/align_summary_65k_renderOrbit_with_mesh_tf.json"
    valid_scenes_dir: "/path/to/objaverse_65k_renderOrbit_outpaint_blank/valid_scenes"
    height: 518
    width: 518
    voxel_res: 64
    use_bbox_layout: true
    skip_exists_check: true
    canonicalize_azimuth: true

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  target: miraccm.data.unidataset.UniDataModule
  params:
    dataset:
      objaverse65kOutpaint:
        target: UniDataset.Scene.ObjaverseSceneDepthDataset
        params:
          <<: *ObjaverseParam65k
          data_indices: [0, null]
          repeat: 3

      objaverse65kOrbit:
        target: UniDataset.Scene.ObjaverseSceneDepthAlphaDataset
        params:
          <<: *ObjaverseParam65kOrbit
          bg_mode: "random" # "black", "white", or "random"
          data_indices: [0, null]
          repeat: 1

    val_dataset:
      objaverse_eval:
        target: UniDataset.Scene.EvalDataset
        params:
          eval_dir: "/path/to/eval_data/objaverse_eval2"
          height: 518
          width: 518
          voxel_res: 64

    batch_size: 4
    eval_batch_size: 1
    num_workers: 16

    batch_sampler: False
    shuffle_train: True

# ---------------------------------------------------------------------------
# System
# ---------------------------------------------------------------------------
system:
  target: miraccm.systems.shape_synthesis.system_ccm_voxel.CCMVoxelDiTSystem
  params:
    check_train_every_n_steps: 100
    cleanup_after_validation_step: true
    cleanup_after_test_step: true

    # Model
    pretrained_model_name_or_path: /path/to/pretrained/TRELLIS-image-large-ss
    init_layout_from_shape: true

    # Experiment
    layout_ccm_resolution: 296
    use_cascaded_layout: true
    keep_layout_condition_in_uncond: true
    use_cropped_condition: true

    # Layout loss: L1 + masked
    layout_loss_type: l1
    layout_masked_loss: true

    # Latent config
    latent_config:
      shape:
        in_channels: 8
        model_channels: 1024
        pos_embedder:
          type: ShapePositionEmbedder
          model_channels: 1024
          patch_size: 1
          resolution: 16
      layout:
        in_channels: 3
        model_channels: 1024
        pos_embedder:
          type: AbsolutePositionEmbedder2D
          model_channels: 1024
          resolution: 296
          patch_size: 8

    # Training
    trainable_modules: []
    gradient_checkpointing: true
    weighting_scheme: logit_normal
    loss_weight_shape: 1.0
    loss_weight_layout: 10.0

    optimizer_lr_shape: 5e-5
    optimizer_lr_layout: 2e-4

    resolution: 64

    # Condition
    text_drop_prob: 0.1

    # Evaluation
    eval_seed: 42
    eval_num_inference_steps: 30
    eval_guidance_scale: 3.0
    best_metric: val/ccm_to_gt_voxel_cd
    best_metric_mode: min

    # Optimizer
    optimizer:
      name: AdamW
      args:
        lr: 1e-4
        betas: [0.9, 0.999]
        weight_decay: 0.0

    # Scheduler: cosine decay directly from peak lr, no warmup
    scheduler:
      name: CosineAnnealingLR
      interval: step
      args:
        T_max: 200000
        eta_min: 1e-5

trainer:
  max_steps: 200000
  log_every_n_steps: 10
  num_sanity_val_steps: 1
  val_check_interval: 1000
  enable_progress_bar: true
  precision: bf16-mixed
  gradient_clip_val: 1.0
  strategy: ddp
  accumulate_grad_batches: 1

checkpoint:
  save_last: True
  save_top_k: -1
  every_n_epochs: 9999
