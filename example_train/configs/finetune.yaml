    summary_json: "/path/to/objaverse_65k_outpaint_blank/align_summary_65k_with_mesh_tf.json"
    valid_scenes_dir: "/path/to/objaverse_65k_outpaint_blank/valid_scenes"
    height: 518
    width: 518
    voxel_res: 64
    use_bbox_layout: true
    skip_exists_check: true
