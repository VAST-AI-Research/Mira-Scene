# ---------------------------------------------------------------------------
# Data — mix 3DFront + Objaverse for finetune
# ---------------------------------------------------------------------------
data:
  target: miraccm.data.unidataset.UniDataModule
  params:
    dataset:
      3DFront:
        target: UniDataset.Scene.BlenderProcSceneDepthDataset
        params:
          <<: *3DFrontParam
          num_instances_per_batch: 1
          data_indices: [0, null]
          repeat: 5

      3DFrontPano2Pesp:
        target: UniDataset.Scene.BlenderProcSceneDepthDataset
        params:
          <<: *3DFrontPano2Pesp
          num_instances_per_batch: 1
          data_indices: [0, null]
          repeat: 5

      InfinigenLegacyComposite:
        target: UniDataset.Scene.infinigen_composite_scene_depth.InfinigenCompositeSceneDepthDataset
        params:
          <<: *InfinigenLegacyCompositeParam
          data_indices: [0, null]
          repeat: 5

      objaverse65kOutpaint:
        target: UniDataset.Scene.ObjaverseSceneDepthDataset
        params:
          <<: *ObjaverseParam65k
          data_indices: [0, null]
          repeat: 2

    val_dataset:
      blendswap_eval:
        target: UniDataset.Scene.EvalDataset
        params:
          eval_dir: "/path/to/eval_data/blendswap_eval"
          height: 518
          width: 518
          voxel_res: 64

    batch_size: 4
    eval_batch_size: 1
    num_workers: 8

    batch_sampler: False
    shuffle_train: True

# ---------------------------------------------------------------------------
# System
# ---------------------------------------------------------------------------
system:
  target: miraccm.systems.shape_synthesis.system_ccm_voxel.CCMVoxelDiTSystem
  params:
    check_train_every_n_steps: 100
    cleanup_after_validation_step: true
    cleanup_after_test_step: true

    # Model — finetune from pretrained pipeline (weights only, no optimizer/scheduler restore)
    pretrained_model_name_or_path: /path/to/outputs/ccm_voxel_scale/pretrain_l1_cosine/pipeline
    init_layout_from_shape: false

    # Experiment
    layout_ccm_resolution: 296
    use_cascaded_layout: true
    keep_layout_condition_in_uncond: true
    use_cropped_condition: true

    # Loss
    layout_loss_type: mse
    layout_masked_loss: true

    # Latent config
    latent_config:
      shape:
        in_channels: 8
        model_channels: 1024
        pos_embedder:
          type: ShapePositionEmbedder
          model_channels: 1024
          patch_size: 1
          resolution: 16
      layout:
        in_channels: 3
        model_channels: 1024
        pos_embedder:
          type: AbsolutePositionEmbedder2D
          model_channels: 1024
          resolution: 296
          patch_size: 8

    # Training
    trainable_modules: []
    gradient_checkpointing: true
    weighting_scheme: logit_normal
    loss_weight_shape: 1.0
    loss_weight_layout: 1.0

    optimizer_lr_shape: 1e-4
    optimizer_lr_layout: 1e-4

    resolution: 64

    # Condition
    text_drop_prob: 0.1

    # Evaluation
    eval_seed: 42
    eval_num_inference_steps: 30
    eval_guidance_scale: 3.0
    best_metric: val/ccm_to_gt_voxel_cd
    best_metric_mode: min

    # Optimizer
    optimizer:
      name: AdamW
      args:
        lr: 1e-4
        betas: [0.9, 0.999]
        weight_decay: 0.0

    # Scheduler: linear decay to 0.5x over 200K steps
    scheduler:
      name: SequentialLR
      interval: step
      milestones: [200000]
      schedulers:
        - name: LinearLR
          args:
            start_factor: 1.0
            end_factor: 0.5
            total_iters: 200000
        - name: ConstantLR
          args:
            factor: 0.5
            total_iters: 9999999

trainer:
  max_steps: 200000
  log_every_n_steps: 10
  num_sanity_val_steps: 16
  val_check_interval: 4000
  enable_progress_bar: true
  precision: bf16-mixed
  gradient_clip_val: 1.0
  strategy: ddp
  accumulate_grad_batches: 1

checkpoint:
  save_last: True
  save_top_k: -1
  every_n_epochs: 9999
